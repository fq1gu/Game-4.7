name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GV: "4.7"
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q mellstroy_run.zip
      - name: Install Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_export_templates.tpz
          unzip -q Godot_v${GV}-stable_linux.x86_64.zip
          mv Godot_v${GV}-stable_linux.x86_64 /usr/local/bin/godot || sudo mv Godot_v${GV}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GV}.stable
          unzip -q Godot_v${GV}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GV}.stable/
      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" > /dev/null
      - name: Configure Android signing and SDK
        run: |
          keytool -genkeypair -v -keystore $HOME/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          JAVA_DIR=$(dirname $(dirname $(readlink -f $(which java))))
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-${GV}.tres; do
            cat > ~/.config/godot/$f <<EOS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
          done
      - name: Import and export APK
        working-directory: mellstroy_run
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Android" build/mellstroy_run.apk
          ls -la build
      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create apk-${{ github.run_number }} mellstroy_run/build/mellstroy_run.apk \
            --title "Меллстрой APK #${{ github.run_number }}" --notes "Debug APK"
